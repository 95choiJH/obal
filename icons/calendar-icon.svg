<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64"
     fill="none"
     role="img"
     aria-labelledby="calendarIconTitle">
  <title id="calendarIconTitle">Calendar</title>

  <!-- Calendar frame -->
  <rect x="10" y="14" width="44" height="40" rx="7"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Header divider -->
  <path d="M10 25H54"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Binding rings -->
  <path d="M21 10V18"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"/>
  <path d="M43 10V18"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Date dots -->
  <circle cx="21" cy="34" r="2" fill="#FFFFFF"/>
  <circle cx="32" cy="34" r="2" fill="#FFFFFF"/>
  <circle cx="43" cy="34" r="2" fill="#FFFFFF"/>

  <circle cx="21" cy="43" r="2" fill="#FFFFFF"/>
  <rect x="29" y="40" width="6" height="6" rx="2"
        fill="#00FFA3"/>
  <circle cx="43" cy="43" r="2" fill="#FFFFFF"/>
</svg>
